<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>导入到 Amazon Image Studio</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        color: #111827;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        font-weight: 600;
        color: #4b5563;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 5px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
      }
      button {
        width: 100%;
        min-height: 40px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        background: #9ca3af;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.5;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <label>
      工作台地址
      <input id="studioUrl" type="url" placeholder="https://amzimage.amzdataincn.com/">
    </label>
    <button id="importButton" type="button">导入当前 Amazon 商品</button>
    <div id="status">在 Amazon 商品页点击导入，工作台会打开导入预览。DOM 导入不需要 API Key。</div>
    <script src="popup.js"></script>
  </body>
</html>
